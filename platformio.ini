platform = espressif8266
board = d1
framework = arduino
lib_deps = 
	arduino-libraries/LiquidCrystal@^1.0.7
	sinricpro/SinricPro@^3.0.1
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
